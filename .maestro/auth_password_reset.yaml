appId: com.miraikousou.lessonapp
name: AUTH-05 パスワードリセットメール送信フロー (tap / navigation only)
---
# パスワードリセット画面の表示 + 主要要素検証 + 「ログインに戻る」navigation 検証
# 作成: qa-2, 2026-05-14
#
# 注意 (学習事項 #11 + #12 継承):
#   - inputText は onChangeText を発火しない → email 入力は skip、tap / navigation のみ
#   - 「リセットメールを送信」button tap 時は email 空 → エラーメッセージ「正しいメールアドレスを入力してください」表示確認
#
# 撮影目標:
#   01_reset_intro.png        = リセット画面表示
#   02_reset_email_error.png  = 空送信時のエラー表示
#   03_reset_back_to_login.png = 「ログインに戻る」遷移確認
#
# 検証項目:
#   - パスワードリセット画面の主要要素 (h1「パスワードリセット」/ メアド label / 送信 button)
#   - 空送信時のエラーバリデーション動作
#   - 「ログインに戻る」link navigate

- launchApp:
    clearState: true
    stopApp: true

- waitForAnimationToEnd:
    timeout: 5000

# ログイン画面から reset link 遷移
- assertVisible: "ログイン"
- tapOn:
    text: "パスワードを忘れた方"
- waitForAnimationToEnd:
    timeout: 3000

# リセット画面の主要要素アサーション
- assertVisible: "パスワードリセット"
- assertVisible: "ご登録のメールアドレスにリセット用リンクを送信します"
- assertVisible: "メールアドレス"
- assertVisible: "リセットメールを送信"
- assertVisible: "ログインに戻る"

# 撮影 1: 初期表示
- takeScreenshot:
    path: ../screenshots/maestro_auth_reset_01_intro

# 空送信エラー検証 (email 未入力で「リセットメールを送信」tap → エラー表示)
- tapOn:
    text: "リセットメールを送信"
- waitForAnimationToEnd:
    timeout: 3000
- assertVisible: "正しいメールアドレスを入力してください"
- takeScreenshot:
    path: ../screenshots/maestro_auth_reset_02_email_error

# 「ログインに戻る」navigate
- tapOn:
    text: "ログインに戻る"
- waitForAnimationToEnd:
    timeout: 3000
- assertVisible: "ログイン"
- assertVisible: "メールアドレスとパスワードを入力してください"
- takeScreenshot:
    path: ../screenshots/maestro_auth_reset_03_back_to_login
